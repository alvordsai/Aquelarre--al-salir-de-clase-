<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050307" />
  <title>Aquelarre</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030205;
      --hot: #ff174f;
      --pink: #ff2d8d;
      --deep: #9a003d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      position: relative;
      min-height: 100dvh;
      isolation: isolate;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 75% 42% at 50% 112%,
          rgba(255, 36, 105, 0.95) 0%,
          rgba(241, 15, 76, 0.58) 22%,
          rgba(145, 0, 54, 0.28) 43%,
          rgba(35, 0, 19, 0.08) 66%,
          rgba(0, 0, 0, 0) 78%),
        radial-gradient(ellipse 115% 78% at 50% 112%,
          rgba(255, 0, 72, 0.17) 0%,
          rgba(0, 0, 0, 0) 58%),
        linear-gradient(180deg, #010103 0%, #050208 68%, #100008 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -23vh;
      width: min(92vw, 1100px);
      height: 50vh;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(255, 20, 86, 0.2);
      filter: blur(62px);
      opacity: 0.9;
      pointer-events: none;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.42), transparent 22%, transparent 78%, rgba(0,0,0,.42)),
        linear-gradient(180deg, rgba(0,0,0,.15), transparent 55%, rgba(0,0,0,.08));
      pointer-events: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      mix-blend-mode: normal;
    }

    @media (prefers-reduced-motion: reduce) {
      canvas {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Fondo oscuro con resplandor rojo y partículas ascendentes">
    <canvas id="embers" aria-hidden="true"></canvas>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("embers");
      const ctx = canvas.getContext("2d", { alpha: true });
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (!ctx) return;
      const particles = [];
      const MAX_DPR = 2;
      const palette = ["#ff2408", "#e84008", "#ff650a", "#ff850e"];
      // Reutiliza el halo: evita crear cientos de degradados en cada fotograma.
      const sprites = palette.map(color => {
        const sprite = document.createElement("canvas");
        sprite.width = sprite.height = 64;
        const context = sprite.getContext("2d");
        const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, color);
        gradient.addColorStop(0.12, color);
        gradient.addColorStop(0.4, color + "70");
        gradient.addColorStop(1, color + "00");
        context.fillStyle = gradient;
        context.fillRect(0, 0, 64, 64);
        return sprite;
      });
      let width = 0;
      let height = 0;
      let rafId = 0;
      let lastTime = 0;
      const random = (min, max) => min + Math.random() * (max - min);

      class Ember {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.originX = random(width * 0.03, width * 0.97);
          this.originY = height + random(4, 40);
          this.radius = random(0.8, 2.6);
          this.speed = random(65, 155);
          this.travel = height * random(0.45, 1.05);
          this.maxLife = this.travel / this.speed;
          this.life = initial ? random(0, this.maxLife) : 0;
          this.drift = random(-16, 16);
          this.phase = random(0, Math.PI * 2);
          this.wave = random(1.2, 2.8);
          this.sway = random(8, 28);
          this.alpha = random(0.65, 1);
          this.colorIndex = Math.floor(random(0, palette.length));
          this.position();
        }

        position() {
          this.x = this.originX + this.drift * this.life
            + (Math.sin(this.phase + this.life * this.wave) - Math.sin(this.phase)) * this.sway;
          this.y = this.originY - this.speed * this.life;
        }

        update(dt) {
          this.life += dt;
          if (this.life >= this.maxLife || this.x < -40 || this.x > width + 40) {
            this.reset();
            return;
          }
          this.position();
        }

        draw() {
          const progress = this.life / this.maxLife;
          const fadeIn = Math.min(1, this.life / 0.25);
          const fadeOut = Math.min(1, (1 - progress) / 0.4);
          const flicker = 0.84 + Math.sin(this.life * 19 + this.phase) * 0.16;
          const opacity = this.alpha * fadeIn * fadeOut * flicker;
          const size = this.radius * 11;

          ctx.globalAlpha = opacity;
          ctx.drawImage(sprites[this.colorIndex], this.x - size / 2, this.y - size / 2, size, size);
        }
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.max(1, Math.floor(width * dpr));
        canvas.height = Math.max(1, Math.floor(height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Limita la cantidad para mantener una animación fluida en móviles.
        const target = Math.max(12, Math.min(30, Math.round(width * height / 50000)));
        particles.length = 0;
        for (let i = 0; i < target; i++) particles.push(new Ember());
        if (!reducedMotion.matches) render();
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        ctx.globalCompositeOperation = "source-over";
        for (const particle of particles) particle.draw();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }

      function animate(now) {
        const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        for (const particle of particles) particle.update(dt);
        render();
        rafId = requestAnimationFrame(animate);
      }

      function start() {
        cancelAnimationFrame(rafId);
        if (reducedMotion.matches || document.hidden) {
          if (reducedMotion.matches) ctx.clearRect(0, 0, width, height);
          return;
        }
        lastTime = performance.now();
        rafId = requestAnimationFrame(animate);
      }

      resize();
      start();

      window.addEventListener("resize", resize, { passive: true });
      reducedMotion.addEventListener?.("change", start);
      document.addEventListener("visibilitychange", start);
    })();
  </script>
</body>
</html>
